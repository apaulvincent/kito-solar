<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="16" fill="url(#bg)"/>
  <!-- Unistrut Rail Behind -->
  <rect x="14" y="92" width="172" height="16" rx="2" fill="#64748B" stroke="#475569" stroke-width="1.5"/>
  <rect x="18" y="97" width="164" height="6" fill="#334155"/>

  <!-- Top Terminal Lugs: IN (+) Red & IN (-) Dark Gray -->
  <g>
    <circle cx="78" cy="22" r="8" fill="#DC2626" stroke="#FCA5A5" stroke-width="2"/>
    <circle cx="78" cy="22" r="3" fill="#CBD5E1"/>
    <circle cx="122" cy="22" r="8" fill="#64748B" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="122" cy="22" r="3" fill="#CBD5E1"/>
  </g>

  <!-- Bottom Terminal Lugs: OUT (+) Red, GND Neon Green, OUT (-) Dark Gray -->
  <g>
    <circle cx="75" cy="178" r="8" fill="#DC2626" stroke="#FCA5A5" stroke-width="2"/>
    <circle cx="75" cy="178" r="3" fill="#CBD5E1"/>
    <circle cx="100" cy="178" r="7.5" fill="#39FF14" stroke="#BBF7D0" stroke-width="1.8"/>
    <circle cx="100" cy="178" r="2.8" fill="#052E16"/>
    <circle cx="125" cy="178" r="8" fill="#64748B" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="125" cy="178" r="3" fill="#CBD5E1"/>
  </g>

  <!-- Top & Bottom Mounting Cleats -->
  <rect x="78" y="25" width="44" height="8" rx="2" fill="#94A3B8"/>
  <rect x="78" y="167" width="44" height="8" rx="2" fill="#94A3B8"/>

  <!-- White Modular DIN Enclosure Body (Matches NodeGeometry case 'breaker' + battery_breaker) -->
  <rect x="44" y="30" width="112" height="140" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="53" y="42" width="94" height="84" rx="5" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="57" y="80" width="86" height="8" fill="#94A3B8"/>

  <!-- Left Pole MCCB Module -->
  <g transform="translate(62, 49)">
    <rect x="0" y="0" width="34" height="70" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="17" cy="8" r="3.5" fill="#94A3B8"/>
    <rect x="11" y="16" width="12" height="6" rx="1" fill="#DC2626"/>
    <rect x="9" y="26" width="16" height="24" rx="2.5" fill="#059669" stroke="#047857" stroke-width="1"/>
    <circle cx="17" cy="62" r="3.5" fill="#94A3B8"/>
  </g>

  <!-- Right Pole MCCB Module -->
  <g transform="translate(104, 49)">
    <rect x="0" y="0" width="34" height="70" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="17" cy="8" r="3.5" fill="#94A3B8"/>
    <rect x="11" y="16" width="12" height="6" rx="1" fill="#DC2626"/>
    <rect x="9" y="26" width="16" height="24" rx="2.5" fill="#059669" stroke="#047857" stroke-width="1"/>
    <circle cx="17" cy="62" r="3.5" fill="#94A3B8"/>
  </g>

  <!-- Heavy-Duty Emerald Tie Bar Handle Linking Both Poles -->
  <rect x="72" y="82" width="56" height="8" rx="2" fill="#10B981" stroke="#047857" stroke-width="1"/>

  <!-- Smoked Inspection Window Glaze Overlay -->
  <rect x="55" y="44" width="90" height="80" rx="4" fill="#0F172A" opacity="0.15"/>

  <!-- Bottom Dark Laser-Etched Rating Badge -->
  <rect x="61" y="138" width="78" height="18" rx="2.5" fill="#1E293B"/>
  <rect x="68" y="145" width="42" height="4" rx="1" fill="#94A3B8" opacity="0.6"/>
</svg>
