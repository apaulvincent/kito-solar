<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="16" fill="url(#bg)"/>
  <!-- Floor Grid Lines -->
  <line x1="12" y1="176" x2="188" y2="176" stroke="#334155" stroke-width="2"/>

  <!-- Top Terminal Lugs: BAT (+) Red, PE GND Neon Green, BAT (-) Dark Gray -->
  <g>
    <circle cx="72" cy="24" r="8" fill="#DC2626" stroke="#FCA5A5" stroke-width="2"/>
    <circle cx="72" cy="24" r="3" fill="#CBD5E1"/>
    <circle cx="100" cy="24" r="7.5" fill="#39FF14" stroke="#BBF7D0" stroke-width="1.8"/>
    <circle cx="100" cy="24" r="2.8" fill="#052E16"/>
    <circle cx="128" cy="24" r="8" fill="#64748B" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="128" cy="24" r="3" fill="#CBD5E1"/>
  </g>

  <!-- Dark Anthracite Side Heat-Dissipation Frames -->
  <rect x="34" y="34" width="132" height="140" rx="6" fill="#334155" filter="url(#shadow)"/>
  <!-- Satin Architectural White Battery Powerwall Enclosure (Matches NodeGeometry case 'battery') -->
  <rect x="40" y="32" width="120" height="144" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Multi-Segment LED State of Charge (SOC) Light Bar -->
  <rect x="54" y="62" width="92" height="12" rx="3" fill="#0F172A"/>
  <g fill="#10B981">
    <rect x="58" y="65" width="6.5" height="6" rx="1"/>
    <rect x="66.5" y="65" width="6.5" height="6" rx="1"/>
    <rect x="75" y="65" width="6.5" height="6" rx="1"/>
    <rect x="83.5" y="65" width="6.5" height="6" rx="1"/>
    <rect x="92" y="65" width="6.5" height="6" rx="1"/>
    <rect x="100.5" y="65" width="6.5" height="6" rx="1"/>
    <rect x="109" y="65" width="6.5" height="6" rx="1"/>
    <rect x="117.5" y="65" width="6.5" height="6" rx="1"/>
    <rect x="126" y="65" width="6.5" height="6" rx="1"/>
    <rect x="134.5" y="65" width="6.5" height="6" rx="1"/>
  </g>

  <!-- Lower Spec Placard -->
  <rect x="66" y="132" width="68" height="18" rx="2.5" fill="#1E293B"/>
  <rect x="76" y="139" width="48" height="4" rx="1" fill="#64748B"/>
</svg>
