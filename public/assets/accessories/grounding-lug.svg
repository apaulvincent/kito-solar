<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="16" fill="url(#bg)"/>

  <!-- 3x Top Neon Green Grounding Terminal Lugs (gnd_1, gnd_2, gnd_3) -->
  <g>
    <circle cx="52" cy="54" r="8" fill="#39FF14" stroke="#BBF7D0" stroke-width="2"/>
    <circle cx="52" cy="54" r="3" fill="#052E16"/>
    <circle cx="100" cy="54" r="8" fill="#39FF14" stroke="#BBF7D0" stroke-width="2"/>
    <circle cx="100" cy="54" r="3" fill="#052E16"/>
    <circle cx="148" cy="54" r="8" fill="#39FF14" stroke="#BBF7D0" stroke-width="2"/>
    <circle cx="148" cy="54" r="3" fill="#052E16"/>
  </g>

  <!-- Green Equipment Grounding Tap Leads -->
  <rect x="49" y="62" width="6" height="18" fill="#10B981"/>
  <rect x="97" y="62" width="6" height="18" fill="#10B981"/>
  <rect x="145" y="62" width="6" height="18" fill="#10B981"/>

  <!-- Downward Earth Grounding Electrode Conduit & Floor Collar -->
  <rect x="96" y="102" width="8" height="72" fill="#94A3B8"/>
  <rect x="90" y="132" width="20" height="8" rx="2" fill="#64748B"/>
  <rect x="86" y="170" width="28" height="8" rx="2" fill="#475569"/>
  <rect x="91" y="167" width="18" height="3" fill="#EAB308"/>

  <!-- 2x Red Polyester Standoff Insulators -->
  <rect x="52" y="72" width="14" height="34" rx="3" fill="#DC2626"/>
  <rect x="134" y="72" width="14" height="34" rx="3" fill="#DC2626"/>

  <!-- Solid Electrolytic Copper Busbar Plate (Matches NodeGeometry case 'grounding') -->
  <rect x="26" y="78" width="148" height="24" rx="3" fill="#B45309" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>

  <!-- 6x Tin-Plated Compression Lugs with Dual Hex Bolts -->
  <g>
    <g transform="translate(42, 82)">
      <rect x="0" y="0" width="12" height="16" rx="1.5" fill="#D97706"/>
      <circle cx="6" cy="4.5" r="2.2" fill="#CBD5E1"/>
      <circle cx="6" cy="11.5" r="2.2" fill="#CBD5E1"/>
    </g>
    <g transform="translate(63, 82)">
