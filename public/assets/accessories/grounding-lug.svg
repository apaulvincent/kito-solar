      <circle cx="6" cy="4.5" r="2.2" fill="#CBD5E1"/>
      <circle cx="6" cy="11.5" r="2.2" fill="#CBD5E1"/>
    </g>
    <g transform="translate(84, 82)">
      <rect x="0" y="0" width="12" height="16" rx="1.5" fill="#D97706"/>
      <circle cx="6" cy="4.5" r="2.2" fill="#CBD5E1"/>
      <circle cx="6" cy="11.5" r="2.2" fill="#CBD5E1"/>
    </g>
    <g transform="translate(105, 82)">
      <rect x="0" y="0" width="12" height="16" rx="1.5" fill="#D97706"/>
      <circle cx="6" cy="4.5" r="2.2" fill="#CBD5E1"/>
      <circle cx="6" cy="11.5" r="2.2" fill="#CBD5E1"/>
