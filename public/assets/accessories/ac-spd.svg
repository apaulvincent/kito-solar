<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="16" fill="url(#bg)"/>
  <!-- Unistrut Rail Behind -->
  <rect x="14" y="92" width="172" height="16" rx="2" fill="#64748B" stroke="#475569" stroke-width="1.5"/>
  <rect x="18" y="97" width="164" height="6" fill="#334155"/>

  <!-- Top Terminal Lugs: SPD (+) Red & SPD (-) Dark Gray -->
  <g>
    <circle cx="75" cy="24" r="8" fill="#DC2626" stroke="#FCA5A5" stroke-width="2"/>
    <circle cx="75" cy="24" r="3" fill="#CBD5E1"/>
    <circle cx="125" cy="24" r="8" fill="#64748B" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="125" cy="24" r="3" fill="#CBD5E1"/>
  </g>

  <!-- Bottom Terminal Lug: SPD GND Neon Green -->
  <g>
    <circle cx="100" cy="178" r="8" fill="#39FF14" stroke="#BBF7D0" stroke-width="2"/>
    <circle cx="100" cy="178" r="3" fill="#052E16"/>
  </g>

  <!-- White Modular DIN SPD Enclosure (Matches NodeGeometry case 'spd') -->
  <rect x="44" y="32" width="112" height="136" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>

  <!-- Left Pluggable MOV Cartridge -->
  <g transform="translate(55, 45)">
    <rect x="0" y="0" width="40" height="80" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="10" y="14" width="20" height="13" rx="2" fill="#10B981" stroke="#059669" stroke-width="1"/>
    <rect x="9" y="36" width="22" height="22" rx="2" fill="#1E293B"/>
    <rect x="7" y="66" width="26" height="6" rx="1.5" fill="#94A3B8"/>
  </g>

  <!-- Right Pluggable MOV Cartridge -->
  <g transform="translate(105, 45)">
    <rect x="0" y="0" width="40" height="80" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="10" y="14" width="20" height="13" rx="2" fill="#10B981" stroke="#059669" stroke-width="1"/>
    <rect x="9" y="36" width="22" height="22" rx="2" fill="#1E293B"/>
    <rect x="7" y="66" width="26" height="6" rx="1.5" fill="#94A3B8"/>
  </g>

  <!-- Bottom Technical Specification Badge -->
  <rect x="61" y="138" width="78" height="16" rx="2.5" fill="#0F172A"/>
  <rect x="68" y="144" width="46" height="4" rx="1" fill="#64748B"/>
</svg>
