<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="railProfileFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="35%" stop-color="#CBD5E1"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="railExtrude" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="channelDepth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="railShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="160" cy="235" rx="110" ry="20" fill="#0F172A" opacity="0.16" filter="blur(6px)"/>

  <!-- Anodized Aluminum 6005-T5 Roof Rail Assembly -->
  <g filter="url(#railShadow)">
    <!-- Extruded Length Running Isometric Backwards Right -->
    <!-- Top Extrusion Surface -->
    <polygon points="100,60 270,40 285,45 115,65" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
    <!-- Top Channel Lip Right Surface -->
    <polygon points="115,65 285,45 285,75 115,95" fill="url(#railExtrude)" stroke="#94A3B8" stroke-width="0.8"/>
    <!-- Side Channel Groove -->
    <polygon points="115,95 285,75 285,115 115,135" fill="#64748B" stroke="#475569" stroke-width="0.8"/>
    <!-- Bottom Side Surface -->
    <polygon points="115,135 285,115 285,145 115,165" fill="url(#railExtrude)" stroke="#94A3B8" stroke-width="0.8"/>
    <!-- Bottom Base Surface -->
    <polygon points="115,165 285,145 270,140 100,160" fill="#334155" stroke="#1E293B" stroke-width="0.8"/>

    <!-- Front Cross-Section Profile (Detailed Architectural Extrusion Cut) -->
    <g transform="translate(45, 60)">
      <!-- Outer Perimeter of Rail Extrusion -->
      <path d="
        M 0,0 
        L 55,0 
        L 55,10 
        L 45,10 
        L 45,25 
        L 55,25 
        L 55,75 
        L 45,75 
        L 45,90 
        L 55,90 
        L 55,100 
        L 0,100 
        L 0,90 
        L 10,90 
        L 10,75 
        L 0,75 
        L 0,25 
        L 10,25 
        L 10,10 
        L 0,10 
        Z
      " fill="url(#railProfileFace)" stroke="#64748B" stroke-width="1.2"/>

      <!-- Top T-Nut Channel Cavity (For Mid/End Clamps) -->
      <path d="M 20,0 L 35,0 L 35,18 L 42,18 L 42,28 L 13,28 L 13,18 L 20,18 Z" fill="url(#channelDepth)"/>

      <!-- Side Mounting Slot (For L-Foot Hex Bolt) -->
      <path d="M 55,42 L 38,42 L 38,58 L 55,58 Z" fill="url(#channelDepth)"/>

      <!-- Cable Management Conduit Recess -->
      <path d="M 0,42 L 17,42 L 17,58 L 0,58 Z" fill="url(#channelDepth)"/>

      <!-- Central Weight-Reduction Cavity -->
      <rect x="22" y="38" width="11" height="24" rx="3" fill="url(#channelDepth)"/>

      <!-- Metallic Specular Edge Line on Extrusion Cut -->
      <path d="M 0,0 L 55,0 L 55,100 L 0,100 Z" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>
    </g>
  </g>

  <!-- Technical Spec Indicator Tag -->
  <g transform="translate(20, 24)">
    <rect x="0" y="0" width="125" height="20" rx="4" fill="#0F172A" opacity="0.85"/>
    <text x="62" y="14" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">2.2M ANODIZED RAIL</text>
  </g>
</svg>