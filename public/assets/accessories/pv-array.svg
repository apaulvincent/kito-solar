<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="16" fill="url(#bg)"/>
  <!-- Concrete Floor Grid Line -->
  <line x1="10" y1="166" x2="190" y2="166" stroke="#334155" stroke-width="2"/>

  <!-- Rear String Combiner Terminal Lugs: (+) Red, GND Neon Green, (-) Dark Gray -->
  <g>
    <circle cx="82" cy="40" r="6.5" fill="#DC2626" stroke="#FCA5A5" stroke-width="1.5"/>
    <circle cx="100" cy="40" r="6" fill="#39FF14" stroke="#BBF7D0" stroke-width="1.5"/>
    <circle cx="118" cy="40" r="6.5" fill="#64748B" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>

  <!-- 3x Galvanized A-Frame Legs & Concrete Pads (Matches NodeGeometry case 'pv') -->
  <g stroke="#64748B" stroke-width="4" stroke-linecap="round">
    <line x1="42" y1="132" x2="42" y2="160"/>
    <line x1="52" y1="74" x2="52" y2="152"/>
    <line x1="96" y1="132" x2="96" y2="160"/>
    <line x1="106" y1="74" x2="106" y2="152"/>
    <line x1="150" y1="132" x2="150" y2="160"/>
    <line x1="160" y1="74" x2="160" y2="152"/>
  </g>
  <g fill="#94A3B8">
    <rect x="33" y="158" width="18" height="6" rx="1"/>
    <rect x="87" y="158" width="18" height="6" rx="1"/>
    <rect x="141" y="158" width="18" height="6" rx="1"/>
  </g>

  <!-- 3x Tilted Monocrystalline Solar Modules with Silver Frames & Diagonal Cell Busbars -->
  <g filter="url(#shadow)">
    <!-- Module 1 -->
    <polygon points="28,60 76,60 64,136 16,136" fill="#0B192C" stroke="#CBD5E1" stroke-width="2.5"/>
    <line x1="28" y1="60" x2="64" y2="136" stroke="#64748B" stroke-width="0.9" opacity="0.7"/>
    <line x1="76" y1="60" x2="16" y2="136" stroke="#64748B" stroke-width="0.9" opacity="0.7"/>

    <!-- Module 2 -->
    <polygon points="82,60 130,60 118,136 70,136" fill="#0B192C" stroke="#CBD5E1" stroke-width="2.5"/>
    <line x1="82" y1="60" x2="118" y2="136" stroke="#64748B" stroke-width="0.9" opacity="0.7"/>
    <line x1="130" y1="60" x2="70" y2="136" stroke="#64748B" stroke-width="0.9" opacity="0.7"/>
    <rect x="97" y="68" width="14" height="4" rx="1" fill="#F8FAFC"/>

    <!-- Module 3 -->
    <polygon points="136,60 184,60 172,136 124,136" fill="#0B192C" stroke="#CBD5E1" stroke-width="2.5"/>
    <line x1="136" y1="60" x2="172" y2="136" stroke="#64748B" stroke-width="0.9" opacity="0.7"/>
    <line x1="184" y1="60" x2="124" y2="136" stroke="#64748B" stroke-width="0.9" opacity="0.7"/>
  </g>
</svg>
