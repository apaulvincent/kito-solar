<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="16" fill="url(#bg)"/>
  <!-- Unistrut Rail Behind -->
  <rect x="14" y="92" width="172" height="16" rx="2" fill="#64748B" stroke="#475569" stroke-width="1.5"/>

  <!-- Top Terminal Lugs: BUS L (+) Red & BUS N (-) Dark Gray -->
  <g>
    <circle cx="74" cy="18" r="8" fill="#DC2626" stroke="#FCA5A5" stroke-width="2"/>
    <circle cx="74" cy="18" r="3" fill="#CBD5E1"/>
    <circle cx="126" cy="18" r="8" fill="#64748B" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="126" cy="18" r="3" fill="#CBD5E1"/>
  </g>

  <!-- Bottom Terminal Lugs: FEED (+) Red, PE GND Neon Green, FEED (-) Dark Gray -->
  <g>
    <circle cx="72" cy="182" r="8" fill="#DC2626" stroke="#FCA5A5" stroke-width="2"/>
    <circle cx="72" cy="182" r="3" fill="#CBD5E1"/>
    <circle cx="100" cy="182" r="7.5" fill="#39FF14" stroke="#BBF7D0" stroke-width="1.8"/>
    <circle cx="100" cy="182" r="2.8" fill="#052E16"/>
    <circle cx="128" cy="182" r="8" fill="#64748B" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="128" cy="182" r="3" fill="#CBD5E1"/>
  </g>

  <!-- Heavy-Duty ANSI 61 Gray Powder-Coated Cabinet (Matches NodeGeometry case 'panel') -->
  <rect x="40" y="24" width="120" height="152" rx="6" fill="#64748B" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/>
  <!-- Flush Door Seam -->
  <rect x="46" y="30" width="108" height="140" rx="4" fill="#475569" stroke="#334155" stroke-width="1.5"/>
  <!-- Left Piano Hinge -->
  <rect x="43" y="32" width="3" height="136" fill="#94A3B8"/>

  <!-- Chrome Flush Slam-Latch Handle -->
  <rect x="140" y="90" width="6" height="22" rx="1.5" fill="#CBD5E1"/>
  <rect x="141" y="96" width="4" height="12" rx="1" fill="#F8FAFC"/>

  <!-- Triangular Electrical Hazard Placard (Pointing Down as in 3D view) -->
  <polygon points="86,52 114,52 100,78" fill="#FBBF24" stroke="#D97706" stroke-width="1"/>
  <rect x="98.5" y="57" width="3" height="11" fill="#0F172A"/>

  <!-- Circuit Directory Document Holder on Lower Door -->
  <rect x="66" y="116" width="68" height="36" rx="2" fill="#E2E8F0" opacity="0.9"/>
  <line x1="74" y1="126" x2="126" y2="126" stroke="#94A3B8" stroke-width="2"/>
  <line x1="74" y1="134" x2="126" y2="134" stroke="#94A3B8" stroke-width="2"/>
  <line x1="74" y1="142" x2="114" y2="142" stroke="#94A3B8" stroke-width="2"/>
</svg>
